<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店铺入驻邀请</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; padding: 20px; }
.card { max-width: 375px; margin: 0 auto; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.bar { background: #ff6b35; height: 4px; }
.content { padding: 24px; }
.content h2 { font-size: 18px; color: #333; margin-bottom: 4px; }
.content .sub { font-size: 13px; color: #ff6b35; font-weight: 600; margin-bottom: 20px; }
.benefit { display: flex; align-items: start; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
.benefit:last-child { border-bottom: none; }
.benefit .num { width: 28px; height: 28px; background: #fff5f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #ff6b35; flex-shrink: 0; }
.benefit .text h4 { font-size: 14px; color: #333; margin-bottom: 2px; }
.benefit .text p { font-size: 12px; color: #999; line-height: 1.5; }
.cta-box { background: #fff5f0; border-radius: 14px; padding: 16px; text-align: center; margin-top: 20px; }
.cta-box p { font-size: 13px; color: #333; margin-bottom: 2px; }
.cta-box .highlight { font-size: 20px; font-weight: 800; color: #ff6b35; }
.footer { text-align: center; padding: 16px; font-size: 11px; color: #ccc; }
.speech { background: #f9f9f9; border-radius: 12px; padding: 14px; margin-top: 16px; font-size: 12px; color: #666; line-height: 1.8; }
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <div class="content">
    <h2>🏪 邀请你加入商丘宠物地图</h2>
    <p class="sub">完全免费 · 零门槛 · 马上有曝光</p>

    <div class="benefit">
      <div class="num">1</div>
      <div class="text"><h4>地图曝光</h4><p>商丘宠物主人打开地图就能看到你的店铺，免费增加一个线上入口</p></div>
    </div>
    <div class="benefit">
      <div class="num">2</div>
      <div class="text"><h4>在线接单</h4><p>上传商品/服务，用户在线下单→微信直接收款，平台不抽成</p></div>
    </div>
    <div class="benefit">
      <div class="num">3</div>
      <div class="text"><h4>宠友社区引流</h4><p>用户在社区看到你的动态→直接咨询→到店消费</p></div>
    </div>

    <div class="speech">
      <strong>💬 进店话术：</strong><br>
      "老板你好，我是商丘宠物地图的运营。你的店铺已经在地图上了（打开给他看 bare-lash.com）。我帮你免费认领一下？上传商品就能在线接单，不收你一分钱。"
    </div>

    <div class="cta-box">
      <p>现在入驻</p>
      <p class="highlight">bare-lash.com</p>
      <p style="font-size:11px;color:#999;margin-top:4px;">微信扫码或浏览器打开</p>
    </div>
  </div>
  <div class="footer">商丘宠物生态平台 · 店主合作通道</div>
</div>
</body>
</html>
